# Netlify configuration for Inventory PWA

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "APP_SECRET,TOKEN_KEY"
  SECRETS_SCAN_ENABLED = "false"

[dev]
  command = "vite"
  port = 8888
  targetPort = 5173

# SPA redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200