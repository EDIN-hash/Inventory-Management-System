# Netlify configuration for Inventory PWA

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "APP_SECRET,TOKEN_KEY"
  SECRETS_SCAN_ENABLED = "false"

[dev]
  command = "vite"
  port = 8888
  targetPort = 5173

# SPA redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# CSP - allow Auth0 and Neon
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src * data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src * data:; connect-src *; frame-src *"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"